[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32c6
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 ; Serial over the USB-C port
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1
  adafruit/Adafruit VEML7700 Library@^2.1.6
  adafruit/Adafruit SHT4x Library@^1.0.5
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^4.0.4
